<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="GCSE & A Level past-paper tracker — Prepare. Practice. Succeed." />
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0D1B2E" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#060E1A" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Exam Chronicle" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png" />
  <link rel="icon" href="./favicon.ico" />
  <meta property="og:title" content="Exam Chronicle" />
  <meta property="og:description" content="GCSE & A Level past-paper tracker. Prepare. Practice. Succeed." />
  <meta property="og:image" content="./icons/icon-512.png" />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet" />
  <title>Exam Chronicle · Past-Paper Tracker</title>
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html{height:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;--ec-vh:100vh}
    @supports(height:100dvh){html{--ec-vh:100dvh}}
    body{min-height:var(--ec-vh);margin:0;padding:0;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden;overscroll-behavior:none;font-family:"Montserrat",system-ui,-apple-system,sans-serif}
    #root{min-height:var(--ec-vh)}
    input,select,textarea{font-size:16px!important}
    button,a,input,select,textarea{touch-action:manipulation}
    button,a{min-height:44px}
    .scrollbar-hide::-webkit-scrollbar{display:none}
    .scrollbar-hide{-ms-overflow-style:none;scrollbar-width:none;overscroll-behavior-x:contain}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/main.jsx"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(err => console.warn("SW:", err)));
    }
  </script>
</body>
</html>
